      function normalizeData(){data.dogs??=[];data.foods??=[];data.meals??={};data.savedPlans??=[];data.weightHistory??=[];data.dogs.forEach(d=>data.meals[d.id]??=[]);if(!data.dogs.some(d=>d.id===data.selectedDog))data.selectedDog=data.dogs[0]?.id||''}
      let view='plan',foodQuery='',toastTimer,selectedPlanIds={};
      const PLAN_DRAG_TYPE='application/x-doggyfeed-plan';
      const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

ion=result.revision}forceNextSave=false;hideSaveConflict();savedImages=images;setStorageStatus(true,'MariaDB connected');if(result.revision)verifyRevision(result.revision);return true}finally{clearTimeout(timer)}});saveQueue=request.catch(error=>{console.error('MariaDB save failed:',error);if(error.conflict){showToast('Not saved: DoggyFeed has newer data from somewhere else');return false}checkServerStatus();setStorageStatus(false,'Database save failed');showToast(`Database save failed: ${error.message}`);return false});return saveQueue};
      const fmt=n=>Number(n||0).toLocaleString(undefined,{maximumFractionDigits:1});
      const fmtDate=value=>{if(!value)return'';const [year,month,day]=value.split('-').map(Number);return new Date(year,month-1,day).toLocaleDateString()};
      const dog=()=>data.dogs.find(d=>d.id===data.selectedDog);

      function render(){dogOptions();$('#today').textContent=new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric'}).format(new Date());$('#top-view').textContent=view==='plan'?'Meal planner':view==='foods'?'Food library':view==='history'?'Weight history':view==='bowls'?'Bowls history':view==='connection'?'Connection test':'My dogs';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===(view==='history'?'dogs':view==='bowls'?'plan':view)));$('#page').classList.toggle('wide',view==='plan');$('#page').innerHTML=view==='plan'?planPage():view==='foods'?foodsPage():view==='history'?historyPage():view==='bowls'?bowlsPage():view==='connection'?connectionPage():dogsPage();bindHistoryPage();bindBowlsPage();bindConnectionPage();bindPage()}
      function bindDogColumn(column){const dogId=column.dataset.dog,select=column.querySelector('[data-plan-select]'),name=column.querySelector('[data-plan-name]'),update=()=>updateSavedPlanButtons(column);select.addEventListener('change',()=>{selectedPlanIds[dogId]=select.value;update()});name.addEventListener('input',update);column.querySelector('[data-plan-save]').addEventListener('click',()=>saveMealPlan(dogId,name.value));column.querySelector('[data-plan-load]').addEventListener('click',()=>loadMealPlan(dogId));column.querySelector('[data-plan-delete]').addEventListener('click',()=>deleteSavedPlan(dogId));column.addEventListener('focusin',()=>selectColumn(dogId));column.addEventListener('dragover',e=>{if(!e.dataTransfer.types.includes(PLAN_DRAG_TYPE)||!planBelongsTo(draggedPlanId,dogId))return;e.preventDefault();e.dataTransfer.dropEffect='copy';column.classList.add('drop-target')});column.addEventListener('dragleave',e=>{if(!column.contains(e.relatedTarget))column.classList.remove('drop-target')});column.addEventListener('drop',e=>{const planId=e.dataTransfer.getData(PLAN_DRAG_TYPE);column.classList.remove('drop-target');if(!planId)return;e.preventDefault();addPlanToBowl(dogId,planId)});update()}

      async function compressFoodImage(file){if(file.size>8*1024*1024)throw new Error('Choose an image smaller than 8 MB');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Choose a JPG, PNG, or WebP image');const bitmap=await createImageBitmap(file),scale=Math.min(1,900/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.82));if(!blob)throw new Error('Unable to process this image');return await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Unable to read this image'));reader.readAsDataURL(blob)})}
      async function saveForm(e){e.preventDefault();const form=e.currentTarget,fd=new FormData(form),kind=form.dataset.kind,id=form.dataset.id;const values=Object.fromEntries(fd.entries());if(kind==='food'){const existing=id?data.foods.find(f=>f.id===id):null,imageFile=values.imageFile;let image=values.removeImage==='yes'?'':existing?.image||'';if(imageFile?.size){try{image=await compressFoodImage(imageFile)}catch(error){showToast(error.message);return}}delete values.imageFile;delete values.removeImage;const item={id:id||`food-${crypto.randomUUID()}`,...values,image,kcal:Number(values.kcal),protein:Number(values.protein),fat:Number(values.fat),fiber:Number(values.fiber)};if(id)data.foods[data.foods.findIndex(f=>f.id===id)]=item;else data.foods.push(item)}else{const photoFile=values.photoFile;let photo=values.removePhoto==='yes'?'':(id?data.dogs.find(d=>d.id===id)?.photo||'':'');if(photoFile?.size){try{photo=await compressFoodImage(photoFile)}catch(error){showToast(error.message);return}}delete values.photoFile;delete values.removePhoto;const item={id:id||`dog-${crypto.randomUUID()}`,name:values.name,weight:Number(values.weight),desiredWeight:Number(values.desiredWeight)>0?Number(values.desiredWeight):'',mealsPerDay:Number(values.mealsPerDay)||1,dailyEnergy:Number(values.dailyEnergy)>0?Number(values.dailyEnergy):'',activity:Number(values.activity),age:values.age,breed:values.breed,gender:values.gender,heat1:values.gender==='Female'?values.heat1:'',heat2:values.gender==='Female'?values.heat2:'',photo};const previous=id?data.dogs.find(d=>d.id===id):null;if(id){const index=data.dogs.findIndex(d=>d.id===id),oldName=data.dogs[index]?.name||'';if(oldName&&oldName!==item.name)for(const plan of data.savedPlans)if(plan.dogId===id&&plan.name.toLowerCase().startsWith(oldName.toLowerCase()))plan.name=`${item.name}${plan.name.slice(oldName.length)}`.slice(0,120);data.dogs[index]=item}else{data.dogs.push(item);data.meals[item.id]=[];data.selectedDog=item.id}recordWeight(item,previous)}closeModal();render();const label=kind==='food'?'Food':'Dog profile';if(await save())showToast(`${label} saved to database`);else if(!serverEnabled)showToast(`${label} saved in this browser only. Not connected to MariaDB.`)}
      function deleteFood(id){const f=data.foods.find(x=>x.id===id);if(!f||!confirm(`Delete ${f.name} from your food library? It will also be removed from meal plans.`))return;data.foods=data.foods.filter(x=>x.id!==id);Object.values(data.meals).forEach(rows=>{for(let i=rows.length-1;i>=0;i--)if(rows[i].foodId===id)rows.splice(i,1)});save();render();showToast('Food deleted')}
      function deleteDog(id){const d=data.dogs.find(x=>x.id===id),planCount=data.savedPlans.filter(p=>p.dogId===id).length;if(!d||!confirm(`Remove ${d.name}, their bowl${planCount?` and ${planCount} saved ${planCount===1?'plan':'plans'}`:''}?`))return;data.dogs=data.dogs.filter(x=>x.id!==id);delete data.meals[id];data.savedPlans=data.savedPlans.filter(p=>p.dogId!==id);data.weightHistory=data.weightHistory.filter(e=>e.dogId!==id);delete selectedPlanIds[id];if(data.selectedDog===id)data.selectedDog=data.dogs[0]?.id||'';save();render();showToast('Dog profile removed')}
      function startApp(){$('#connection-test-link')?.addEventListener('click',e=>{e.preventDefault();view='connection';render();window.scrollTo(0,0)});document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;render()}));$('#dog-select').addEventListener('change',e=>{data.selectedDog=e.target.value;save();if(view==='plan'){render();showSelectedColumn()}});$('#modal-root').addEventListener('submit',e=>{const form=e.target;if(form instanceof HTMLFormElement&&form.id==='edit-form'){e.preventDefault();saveForm({currentTarget:form,preventDefault(){}}).catch(error=>{console.error('Form save failed:',error);showToast(`Unable to save: ${error.message}`)})}},true);document.addEventListener('click',e=>{const target=e.target;if(!(target instanceof Element))return;if(target.closest('[data-close]')||target.matches('[data-close-overlay]')){e.preventDefault();closeModal()}const historyLink=target.closest('[data-weight-history]');if(historyLink){e.preventDefault();openWeightHistory(historyLink.dataset.weightHistory)}const bowlsLink=target.closest('[data-bowls-history]');if(bowlsLink){e.preventDefault();openBowlsHistory(bowlsLink.dataset.bowlsHistory)}},true);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render()}
      async function initialize(){let staleWarning='';try{const response=await fetch(`/api/state?t=${Date.now()}`,{cache:'no-store'});if(!response.ok)throw new Error(`Server load failed (${response.status})`);const savedState=await response.json();serverEnabled=true;setStorageStatus(true,'MariaDB connected');const revision=Number(savedState?.revision)||0,last=lastRevision();serverRevision=revision;setStorageStatus(true,'MariaDB connected');if(savedState)delete savedState.revision;if(savedState&&revision<last){staleWarning=`The server sent older data (save #${revision}) than your last save (#${last}). A proxy or CDN may be caching DoggyFeed, or this address reaches a different DoggyFeed server.`;reportSaveError(staleWarning,200,0)}if(savedState){data=savedState;normalizeData();savedImages=currentImages()}else{data=localData||structuredClone(starter);normalizeData();await save()}}catch(error){serverEnabled=false;data=localData||structuredClone(starter);setStorageStatus(false,'Browser storage only');showToast('MariaDB unavailable. Open DoggyFeed through the Node server and check its database settings.');console.error('Using browser storage because the Node server is unavailable:',error)}normalizeData();startApp();if(staleWarning){setStorageStatus(false,'Server data is out of date');showToast(staleWarning)}if(serverEnabled)checkServerStatus()}
      // Warns when the running server is older than the files on disk (updated without a restart), or too old
      // to answer this check at all. Either way, saves from this page may not reach the database.
      async function checkServerStatus(){const banner=$('#server-banner');if(!banner)return;let message='';try{const response=await fetch(`/api/server-status?t=${Date.now()}`,{cache:'no-store'});if(response.status===404)message='The DoggyFeed server is running an older version than this page, so changes may not be saved to the database.';else if(response.ok){const status=await response.json();if(status.restartNeeded)message=`DoggyFeed was updated after its server started (${new Date(status.startedAt).toLocaleString()}), so changes may not be saved to the database.`}}catch{}banner.innerHTML=message?`<strong>Restart the DoggyFeed server.</strong> ${esc(message)} On the server computer, stop DoggyFeed and run <code>npm start</code> again (or restart its service), then reload this page.`:'';banner.classList.toggle('hidden',!message);if(message)setStorageStatus(false,'Server restart needed')}
      initialize();
    })();
