<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>

    .sidebar{padding:27px 18px 20px 24px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:34px;background:#f8f8f3}.brand{display:flex;gap:11px;align-items:center;padding:0 8px}.brand-mark{width:38px;height:38px;border-radius:13px;background:var(--green);color:var(--lime);display:grid;place-items:center;font-size:20px;font-weight:700}.brand-name{font:600 20px 'Fraunces',Georgia,serif;letter-spacing:0}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.nav-label{padding:0 11px 10px;font-size:10px;letter-spacing:1.3px;font-weight:700;color:#9aa297;text-transform:uppercase}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#69736a;padding:12px 12px;border-radius:8px;text-align:left;display:flex;align-items:center;gap:12px;font-weight:600;font-size:13px;transition:background .18s,color .18s}.nav button:hover{background:#edf0e9;color:var(--ink)}.nav button.active{background:var(--green);color:#fff}.nav-symbol{width:19px;text-align:center;font-size:16px}.sidebar-note{margin-top:auto;border-top:1px solid var(--line);padding:18px 8px 0;color:var(--muted);font-size:11px;line-height:1.65}.sidebar-note strong{color:var(--ink);display:block;margin-bottom:4px;font-size:12px}
    .main{min-width:0}.topbar{height:76px;padding:0 clamp(22px,5vw,68px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#f8f8f3}.top-context{font-size:12px;color:var(--muted)}.top-context strong{color:var(--ink);font-weight:600}.top-actions{display:flex;align-items:center;gap:10px}.today{font-size:12px;color:var(--muted);padding-right:10px}.select-dog{border:1px solid var(--line);background:white;border-radius:8px;padding:9px 32px 9px 12px;color:var(--ink);font-size:12px;max-width:190px}.page{max-width:1240px;margin:0 auto;padding:36px clamp(22px,5vw,68px) 70px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:25px;animation:rise .38s both}.eyebrow{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#78905a;font-weight:700;margin:0 0 8px}.page h1{font:500 clamp(30px,3.2vw,42px)/1.08 'Fraunces',Georgia,serif;letter-spacing:0;margin:0;color:#26372d}.page-subtitle{font-size:13px;color:var(--muted);margin:9px 0 0}.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:7px;padding:11px 15px;background:var(--green);color:#fff;font-size:12px;font-weight:700;transition:transform .16s,background .16s}.button:hover{background:#1f4837;transform:translateY(-1px)}.button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.button.secondary:hover{background:#f2f5ed}.button.danger{color:#a74432;background:#fff0eb}.button.small{padding:8px 11px;font-size:11px}.button:disabled{opacity:.45;cursor:not-allowed;transform:none}.icon-button{width:34px;height:34px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#657067;font-size:17px;display:grid;place-items:center}.icon-button:hover{background:#f4f6ef;color:var(--ink)}

    .summary-panel{overflow:hidden}.summary-hero{position:relative;min-height:200px;padding:20px;color:white;isolation:isolate;background:#315b47 url('https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=900&q=85') center 44%/cover}.summary-hero:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#183a2de8 0%,#1e412fb8 58%,#19372f36 100%);z-index:-1}.summary-hero .eyebrow{color:var(--lime);margin-bottom:6px}.summary-hero h2{font:500 23px 'Fraunces',Georgia,serif;margin:0 0 16px}.energy-line{display:flex;align-items:baseline;gap:6px}.energy-number{font-size:31px;font-weight:600;letter-spacing:0}.energy-unit{font-size:11px;color:#ffffffbc}.energy-track{height:5px;background:#ffffff48;border-radius:5px;margin:12px 0 7px;overflow:hidden}.energy-fill{height:100%;width:0;background:var(--lime);border-radius:5px;transition:width .35s}.energy-caption{font-size:10px;color:#ffffffc9}.summary-stats{padding:5px 20px}.stat{padding:13px 0;border-bottom:1px solid #edf0ea;display:flex;align-items:center;justify-content:space-between}.stat:last-child{border-bottom:0}.stat-label{font-size:11px;color:var(--muted)}.stat-value{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}.stat-value small{font-weight:400;color:var(--muted)}.disclaimer{padding:12px 15px;margin:0 16px 17px;border-radius:6px;background:#f4f5ed;color:#7d8577;font-size:10px;line-height:1.55}.below-grid{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.quick-card{padding:17px 19px;display:flex;gap:13px;align-items:center}.quick-icon{width:37px;height:37px;flex:none;border-radius:10px;background:var(--green-soft);display:grid;place-items:center;color:var(--green);font-size:17px}.quick-card h3{font-size:12px;margin:0 0 4px}.quick-card p{font-size:10px;color:var(--muted);margin:0}.quick-card .button{margin-left:auto;flex:none}
    .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px}.search{flex:1;max-width:350px;border:1px solid var(--line);background:white;border-radius:7px;padding:10px 12px;font-size:12px}.count{font-size:11px;color:var(--muted);margin-left:auto}.table-panel{overflow:hidden}.food-table{width:100%;border-collapse:collapse;text-align:left}.food-table th{background:#f8f9f5;color:#858e84;font-size:9px;letter-spacing:.7px;text-transform:uppercase;padding:12px 17px}.food-table td{padding:13px 17px;border-top:1px solid #edf0ea;font-size:11px}.food-table tr:hover td{background:#fcfcf9}.food-table td:first-child{font-weight:700;font-size:12px}.food-table .values{color:#627064;font-variant-numeric:tabular-nums}.category{display:inline-block;padding:4px 7px;background:#eef3ea;color:#52644e;border-radius:4px;font-size:9px}.row-actions{display:flex;justify-content:flex-end;gap:6px}.dog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.dog-card{padding:18px;border:1px solid var(--line);border-radius:8px;background:#fff;animation:rise .3s both}.dog-card-top{display:flex;justify-content:space-between;align-items:flex-start}.dog-avatar{width:42px;height:42px;border-radius:13px;background:var(--coral-soft);display:grid;place-items:center;font-size:20px}.dog-card h2{font:500 20px 'Fraunces',Georgia,serif;margin:14px 0 4px}.dog-detail{font-size:11px;color:var(--muted)}.dog-energy{border-top:1px solid #edf0ea;margin-top:15px;padding-top:12px;display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}.dog-energy strong{font-size:11px;color:var(--ink)}.dog-actions{display:flex;gap:7px;margin-top:15px}.dog-actions .button{flex:1}.notice{padding:12px 14px;border-radius:7px;background:#f0f3e9;color:#657454;font-size:11px;line-height:1.6;margin-top:17px}
    .modal-backdrop{position:fixed;inset:0;background:#19251eb8;display:grid;place-items:center;padding:20px;z-index:10;animation:fade .16s}.modal{width:min(440px,100%);max-height:calc(100vh - 40px);overflow:auto;background:#fff;border-radius:10px;box-shadow:var(--shadow);padding:23px;animation:rise .2s}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:17px}.modal h2{font:500 23px 'Fraunces',Georgia,serif;margin:0}.modal-head p{font-size:11px;color:var(--muted);margin:6px 0 0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:10px;font-weight:700;color:#5e695e}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px;font-size:12px;color:var(--ink);background:#fff}.form-help{font-size:10px;color:var(--muted);line-height:1.5;margin:12px 0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;right:22px;bottom:20px;background:var(--ink);color:#fff;padding:11px 16px;border-radius:7px;font-size:12px;box-shadow:var(--shadow);z-index:20;animation:rise .2s}.hidden{display:none!important}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}
    @media(max-width:980px){.app-shell{grid-template-columns:190px minmax(0,1fr)}.sidebar{padding-left:15px}.planner-grid{grid-template-columns:minmax(0,1fr) 280px}.meal-body{padding:0 15px}.meal-labels,.meal-row{grid-template-columns:minmax(100px,1.3fr) 60px 55px 65px 25px;gap:6px}.quantity{width:58px}.below-grid{grid-template-columns:1fr}}
    @media(max-width:760px){.app-shell{display:block}.sidebar{height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:10px}.brand{padding:0}.brand-mark{width:34px;height:34px}.brand-name{font-size:18px}.brand small,.nav-label,.sidebar-note{display:none}.nav{display:flex;gap:3px}.nav button{font-size:11px;padding:9px 10px;gap:6px}.nav-symbol{display:none}.topbar{height:58px;padding:0 18px}.top-context{font-size:10px}.today{display:none}.page{padding:26px 18px 45px}.planner-grid{grid-template-columns:1fr}.summary-panel{order:-1}.summary-hero{min-height:172px}.page-head{align-items:flex-start}.page-head .button{padding:10px 11px;font-size:11px}.food-table th,.food-table td{padding:11px 9px}.food-table th:nth-child(4),.food-table td:nth-child(4){display:none}.toolbar{flex-wrap:wrap}.search{max-width:none}.count{width:100%;margin-left:0}.meal-labels,.meal-row{grid-template-columns:minmax(90px,1.2fr) 55px 52px 55px 23px;gap:5px}.meal-body{padding:0 10px}.add-food-row{padding:13px 10px}.unit-note{display:none}}
    @media(max-width:420px){.nav button{padding:8px 7px;font-size:10px}.top-context{max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.select-dog{max-width:155px;padding-left:8px}.page{padding-left:13px;padding-right:13px}.meal-labels,.meal-row{grid-template-columns:minmax(78px,1fr) 52px 44px 48px 20px;gap:4px}.meal-labels{font-size:8px}.quantity{width:50px}.number-cell{font-size:10px}.food-table td:nth-child(3),.food-table th:nth-child(3){display:none}}
  </style>

<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark" aria-hidden="true">d</div><div><div class="brand-name">DoggyFeed</div><small>Nutrition, made clearer</small></div></div>
      <div><div class="nav-label">Workspace</div><nav class="nav" aria-label="Main navigation"><button class="active" data-view="plan"><span class="nav-symbol" aria-hidden="true">◷</span>Meal planner</button><button data-view="foods"><span class="nav-symbol" aria-hidden="true">▦</span>Food library</button><button data-view="dogs"><span class="nav-symbol" aria-hidden="true">♧</span>My dogs</button></nav></div>
      <div class="sidebar-note"><strong>A thoughtful bowl starts here.</strong>Keep food values close to the package label. DoggyFeed totals are planning aids, not veterinary advice.</div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="top-context"><strong id="top-view">Meal planner</strong> <span>/ DoggyFeed</span></div><div class="top-actions"><span class="today" id="today"></span><select class="select-dog" id="dog-select" aria-label="Select dog"></select></div></header>
      <section class="page" id="page"></section>
    </main>
  </div>
  <div id="modal-root"></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script>
    (()=>{
      const KEY='doggyfeed-data-v1';
      const starter={dogs:[{id:'dog-milo',name:'Milo',weight:12.4,activity:1.6,age:'Adult',breed:'Mixed breed'},{id:'dog-luna',name:'Luna',weight:7.8,activity:1.4,age:'Senior',breed:'Cocker spaniel'}],foods:[{id:'food-kibble',name:'Chicken kibble',category:'Dry food',kcal:380,protein:26,fat:15,fiber:4},{id:'food-turkey',name:'Turkey, cooked',category:'Protein',kcal:189,protein:29,fat:7,fiber:0},{id:'food-pumpkin',name:'Pumpkin, plain',category:'Produce',kcal:34,protein:1,fat:0.1,fiber:2.9},{id:'food-yogurt',name:'Plain yogurt',category:'Dairy',kcal:61,protein:3.5,fat:3.3,fiber:0},{id:'food-wet',name:'Beef wet food',category:'Wet food',kcal:112,protein:10,fat:6,fiber:0.5},{id:'food-blueberry',name:'Blueberries',category:'Produce',kcal:57,protein:0.7,fat:0.3,fiber:2.4}],meals:{'dog-milo':[],'dog-luna':[]},selectedDog:'dog-milo'};
      let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(starter)}catch{data=structuredClone(starter)}
      data.dogs??=[];data.foods??=[];data.meals??={};data.dogs.forEach(d=>data.meals[d.id]??=[]);if(!data.dogs.some(d=>d.id===data.selectedDog))data.selectedDog=data.dogs[0]?.id||'';
      let view='plan',foodQuery='',toastTimer;
      const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
      const fmt=n=>Number(n||0).toLocaleString(undefined,{maximumFractionDigits:1});
      const dog=()=>data.dogs.find(d=>d.id===data.selectedDog);
      const target=d=>d?70*Math.pow(Number(d.weight)||0,.75)*Number(d.activity||1.6):0;
      const totals=()=>{const result={kcal:0,protein:0,fat:0,fiber:0};(data.meals[data.selectedDog]||[]).forEach(row=>{const f=data.foods.find(x=>x.id===row.foodId);if(!f)return;for(const key of Object.keys(result))result[key]+=(Number(f[key])||0)*(Number(row.grams)||0)/100});return result};
      function showToast(message){const el=$('#toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2200)}
      function dogOptions(){const select=$('#dog-select');if(!data.dogs.length){select.innerHTML='<option value="">No dogs yet</option>';select.disabled=true;return}select.disabled=false;select.innerHTML=data.dogs.map(d=>`<option value="${esc(d.id)}" ${d.id===data.selectedDog?'selected':''}>${esc(d.name)}</option>`).join('')}
      function render(){dogOptions();$('#today').textContent=new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric'}).format(new Date());$('#top-view').textContent=view==='plan'?'Meal planner':view==='foods'?'Food library':'My dogs';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#page').innerHTML=view==='plan'?planPage():view==='foods'?foodsPage():dogsPage();bindPage()}
      function planPage(){const d=dog(),t=totals(),goal=target(d),percent=goal?Math.min(100,t.kcal/goal*100):0;const rows=data.meals[data.selectedDog]||[];return `<div class="page-head"><div><p class="eyebrow">Daily bowl</p><h1>Meal planner</h1><p class="page-subtitle">Build a meal and see what the numbers add up to.</p></div><button class="button" data-action="add-food">+ Add food</button></div>${!d?`<div class="panel meal-empty"><strong>Add a dog to get started</strong>Create a profile before planning a bowl.<br><button class="button" data-action="new-dog" style="margin-top:15px">Add a dog</button></div>`:`<div class="planner-grid"><section class="panel meal-panel"><div class="panel-heading"><div><h2>${esc(d.name)}'s bowl</h2><p>${esc(d.age)} · ${fmt(d.weight)} kg · ${esc(d.breed||'Profile')}</p></div><button class="button secondary small" data-action="new-dog">Manage dogs</button></div><div class="meal-body">${rows.length?`<div class="meal-labels"><span>Food</span><span>Amount</span><span>Energy</span><span>Protein</span><span></span></div>${rows.map((r,i)=>{const f=data.foods.find(x=>x.id===r.foodId);if(!f)return'';return `<div class="meal-row"><div><div class="food-name">${esc(f.name)}</div><div class="food-meta">${esc(f.category)} · per 100 g</div></div><div><input class="quantity" type="number" min="0" step="5" value="${esc(r.grams)}" aria-label="Amount of ${esc(f.name)} in grams" data-grams="${i}"></div><div class="number-cell">${fmt(f.kcal*r.grams/100)} <small>kcal</small></div><div class="number-cell">${fmt(f.protein*r.grams/100)} <small>g</small></div><button class="remove" aria-label="Remove ${esc(f.name)}" data-remove="${i}">×</button></div>`}).join('')}`:`<div class="meal-empty"><strong>Your bowl is ready to build</strong>Add foods and enter the amount served.</div>`}</div><div class="add-food-row"><select id="quick-food" aria-label="Choose a food to add"><option value="">Choose from food library</option>${data.foods.map(f=>`<option value="${esc(f.id)}">${esc(f.name)}</option>`).join('')}</select><button class="button secondary small" data-action="quick-add">Add</button><span class="unit-note">All amounts in grams</span></div></section><aside class="panel summary-panel"><div class="summary-hero"><p class="eyebrow">Estimated energy</p><h2>Today's total</h2><div class="energy-line"><span class="energy-number">${fmt(t.kcal)}</span><span class="energy-unit">of ~${fmt(goal)} kcal</span></div><div class="energy-track" aria-label="${fmt(percent)}% of estimated daily energy reference"><div class="energy-fill" style="width:${percent}%"></div></div><div class="energy-caption">${fmt(percent)}% of estimated daily reference</div></div><div class="summary-stats"><div class="stat"><span class="stat-label">Protein</span><span class="stat-value">${fmt(t.protein)} <small>g</small></span></div><div class="stat"><span class="stat-label">Fat</span><span class="stat-value">${fmt(t.fat)} <small>g</small></span></div><div class="stat"><span class="stat-label">Fiber</span><span class="stat-value">${fmt(t.fiber)} <small>g</small></span></div><div class="stat"><span class="stat-label">Foods in bowl</span><span class="stat-value">${rows.length}</span></div></div><p class="disclaimer">Energy reference is a rough estimate based on weight and activity. Individual needs vary. Ask your veterinarian about a complete diet and feeding amounts.</p></aside></div><div class="below-grid"><div class="panel quick-card"><div class="quick-icon" aria-hidden="true">▦</div><div><h3>${data.foods.length} foods in your library</h3><p>Nutrition values are listed per 100 g.</p></div><button class="button secondary small" data-view-link="foods">Open library</button></div><div class="panel quick-card"><div class="quick-icon" aria-hidden="true">♧</div><div><h3>${data.dogs.length} dog profiles</h3><p>Each dog has an individual meal plan.</p></div><button class="button secondary small" data-view-link="dogs">View dogs</button></div></div>`}`}
      function foodsPage(){const foods=data.foods.filter(f=>`${f.name} ${f.category}`.toLowerCase().includes(foodQuery.toLowerCase()));return `<div class="page-head"><div><p class="eyebrow">Your ingredients</p><h1>Food library</h1><p class="page-subtitle">Keep the foods you use and their nutrition values in one place.</p></div><button class="button" data-action="new-food">+ Add food</button></div><div class="toolbar"><input class="search" id="food-search" placeholder="Search foods" aria-label="Search foods" value="${esc(foodQuery)}"><span class="count">${foods.length} of ${data.foods.length} foods</span></div><div class="panel table-panel"><table class="food-table"><thead><tr><th>Food</th><th>Category</th><th>Energy</th><th>Protein</th><th>Fat</th><th>Fiber</th><th></th></tr></thead><tbody>${foods.length?foods.map(f=>`<tr><td>${esc(f.name)}</td><td><span class="category">${esc(f.category)}</span></td><td class="values">${fmt(f.kcal)} kcal</td><td class="values">${fmt(f.protein)} g</td><td class="values">${fmt(f.fat)} g</td><td class="values">${fmt(f.fiber)} g</td><td><div class="row-actions"><button class="icon-button" title="Edit ${esc(f.name)}" aria-label="Edit ${esc(f.name)}" data-edit-food="${esc(f.id)}">✎</button><button class="icon-button" title="Delete ${esc(f.name)}" aria-label="Delete ${esc(f.name)}" data-delete-food="${esc(f.id)}">×</button></div></td></tr>`).join(''):`<tr><td colspan="7" style="text-align:center;padding:36px;color:#788178">No matching foods. Add one to your library.</td></tr>`}</tbody></table></div><div class="notice">Nutrition values are per 100 g. Starter entries are examples only; verify values against the product label or a trusted nutrient database before relying on them.</div>`}
      function dogsPage(){return `<div class="page-head"><div><p class="eyebrow">The whole pack</p><h1>My dogs</h1><p class="page-subtitle">Each profile keeps its own bowl and energy reference.</p></div><button class="button" data-action="new-dog">+ Add dog</button></div>${data.dogs.length?`<div class="dog-grid">${data.dogs.map((d,i)=>`<article class="dog-card" style="animation-delay:${i*45}ms"><div class="dog-card-top"><div class="dog-avatar" aria-hidden="true">${i%2?'♧':'●'}</div><button class="icon-button" title="Edit ${esc(d.name)}" aria-label="Edit ${esc(d.name)}" data-edit-dog="${esc(d.id)}">✎</button></div><h2>${esc(d.name)}</h2><div class="dog-detail">${esc(d.breed||'Dog')} · ${esc(d.age)} · ${fmt(d.weight)} kg</div><div class="dog-energy"><span>Estimated daily energy reference</span><strong>~${fmt(target(d))} kcal</strong></div><div class="dog-actions"><button class="button small" data-select-dog="${esc(d.id)}">Plan a meal</button><button class="button secondary small" data-delete-dog="${esc(d.id)}">Remove</button></div></article>`).join('')}</div>`:`<div class="panel meal-empty"><strong>No dog profiles yet</strong>Add a dog to start planning meals.<br><button class="button" data-action="new-dog" style="margin-top:15px">Add a dog</button></div>`}<div class="notice">The energy reference uses a general weight-based estimate and an activity multiplier you choose. It is not an individualized feeding prescription; puppies, health conditions, and life stages may need different guidance.</div>`}
      function openModal(type,item){const editing=!!item;const title=type==='food'?(editing?'Edit food':'Add a food'):(editing?'Edit dog profile':'Add a dog');let fields='';if(type==='food'){fields=`<div class="field full"><label for="f-name">Food name</label><input id="f-name" name="name" required maxlength="60" value="${esc(item?.name||'')}" placeholder="e.g. Salmon kibble"></div><div class="field full"><label for="f-category">Category</label><select id="f-category" name="category">${['Dry food','Wet food','Protein','Produce','Dairy','Treat','Other'].map(c=>`<option ${item?.category===c?'selected':''}>${c}</option>`).join('')}</select></div>${[['kcal','Energy (kcal)','e.g. 350'],['protein','Protein (g)','e.g. 24'],['fat','Fat (g)','e.g. 12'],['fiber','Fiber (g)','e.g. 3']].map(([n,l,p])=>`<div class="field"><label for="f-${n}">${l} per 100 g</label><input id="f-${n}" name="${n}" type="number" min="0" max="10000" step="0.1" required value="${esc(item?.[n]??'')}" placeholder="${p}"></div>`).join('')}<p class="form-help full">Enter the nutrition values per 100 g from the package or a reliable database. Values here are used to calculate the bowl totals.</p>`}else{fields=`<div class="field full"><label for="d-name">Name</label><input id="d-name" name="name" required maxlength="40" value="${esc(item?.name||'')}" placeholder="e.g. Milo"></div><div class="field"><label for="d-weight">Weight (kg)</label><input id="d-weight" name="weight" type="number" min="0.1" max="250" step="0.1" required value="${esc(item?.weight??'')}" placeholder="12.5"></div><div class="field"><label for="d-age">Life stage</label><select id="d-age" name="age">${['Puppy','Adult','Senior'].map(a=>`<option ${item?.age===a?'selected':''}>${a}</option>`).join('')}</select></div><div class="field full"><label for="d-breed">Breed or note (optional)</label><input id="d-breed" name="breed" maxlength="50" value="${esc(item?.breed||'')}" placeholder="Mixed breed"></div><div class="field full"><label for="d-activity">Activity estimate</label><select id="d-activity" name="activity">${[[1.2,'Low activity'],[1.4,'Gentle / senior'],[1.6,'Typical adult'],[1.8,'Active'],[2,'Very active']].map(([v,l])=>`<option value="${v}" ${Number(item?.activity??1.6)===v?'selected':''}>${l}</option>`).join('')}</select></div><p class="form-help full">Used only for a rough daily energy reference. Your veterinarian can help determine an appropriate target for this dog.</p>`}$('#modal-root').innerHTML=`<div class="modal-backdrop" data-close-overlay><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><h2 id="modal-title">${title}</h2><p>${type==='food'?'Nutrition details are stored per 100 g.':'Add basic details for this dog.'}</p></div><button class="icon-button" data-close aria-label="Close dialog">×</button></div><form id="edit-form" data-kind="${type}" data-id="${esc(item?.id||'')}"><div class="form-grid">${fields}</div><div class="modal-actions"><button type="button" class="button secondary" data-close>Cancel</button><button class="button" type="submit">${editing?'Save changes':'Save'}</button></div></form></section></div>`;$('#'+(type==='food'?'f-name':'d-name')).focus()}
      function closeModal(){$('#modal-root').innerHTML=''}
      function bindPage(){document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.action;if(a==='new-food')openModal('food');if(a==='new-dog')openModal('dog');if(a==='add-food'){$('#quick-food')?.focus();$('#quick-food')?.scrollIntoView({behavior:'smooth',block:'center'})}if(a==='quick-add'){const id=$('#quick-food').value;if(!id){showToast('Choose a food first');return}addFoodToMeal(id)}}));document.querySelectorAll('[data-view-link]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.viewLink;render()}));document.querySelectorAll('[data-grams]').forEach(input=>input.addEventListener('change',()=>{const value=Math.max(0,Number(input.value)||0);data.meals[data.selectedDog][Number(input.dataset.grams)].grams=value;save();render()}));document.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>{data.meals[data.selectedDog].splice(Number(b.dataset.remove),1);save();render();showToast('Food removed from bowl')}));document.querySelectorAll('[data-edit-food]').forEach(b=>b.addEventListener('click',()=>openModal('food',data.foods.find(f=>f.id===b.dataset.editFood))));document.querySelectorAll('[data-delete-food]').forEach(b=>b.addEventListener('click',()=>deleteFood(b.dataset.deleteFood)));document.querySelectorAll('[data-edit-dog]').forEach(b=>b.addEventListener('click',()=>openModal('dog',data.dogs.find(d=>d.id===b.dataset.editDog))));document.querySelectorAll('[data-delete-dog]').forEach(b=>b.addEventListener('click',()=>deleteDog(b.dataset.deleteDog)));document.querySelectorAll('[data-select-dog]').forEach(b=>b.addEventListener('click',()=>{data.selectedDog=b.dataset.selectDog;view='plan';save();render()}));const search=$('#food-search');search?.addEventListener('input',()=>{foodQuery=search.value;const pos=search.selectionStart;const page=$('#page');page.innerHTML=foodsPage();const next=$('#food-search');next.focus();next.setSelectionRange(pos,pos);bindPage()});$('#edit-form')?.addEventListener('submit',saveForm);$('#modal-root').querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeModal));$('#modal-root').querySelector('[data-close-overlay]')?.addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()})}
      function addFoodToMeal(id){const row=(data.meals[data.selectedDog]||[]).find(r=>r.foodId===id);if(row)row.grams=Number(row.grams)+50;else data.meals[data.selectedDog].push({foodId:id,grams:100});save();render();showToast('Added to bowl')}
      function saveForm(e){e.preventDefault();const form=e.currentTarget,fd=new FormData(form),kind=form.dataset.kind,id=form.dataset.id;const values=Object.fromEntries(fd.entries());if(kind==='food'){const item={id:id||`food-${crypto.randomUUID()}`,...values,kcal:Number(values.kcal),protein:Number(values.protein),fat:Number(values.fat),fiber:Number(values.fiber)};if(id)data.foods[data.foods.findIndex(f=>f.id===id)]=item;else data.foods.push(item)}else{const item={id:id||`dog-${crypto.randomUUID()}`,name:values.name,weight:Number(values.weight),activity:Number(values.activity),age:values.age,breed:values.breed};if(id)data.dogs[data.dogs.findIndex(d=>d.id===id)]=item;else{data.dogs.push(item);data.meals[item.id]=[];data.selectedDog=item.id}}save();closeModal();render();showToast(kind==='food'?'Food saved':'Dog profile saved')}
      function deleteFood(id){const f=data.foods.find(x=>x.id===id);if(!f||!confirm(`Delete ${f.name} from your food library? It will also be removed from meal plans.`))return;data.foods=data.foods.filter(x=>x.id!==id);Object.values(data.meals).forEach(rows=>{for(let i=rows.length-1;i>=0;i--)if(rows[i].foodId===id)rows.splice(i,1)});save();render();showToast('Food deleted')}
      function deleteDog(id){const d=data.dogs.find(x=>x.id===id);if(!d||!confirm(`Remove ${d.name} and their meal plan?`))return;data.dogs=data.dogs.filter(x=>x.id!==id);delete data.meals[id];if(data.selectedDog===id)data.selectedDog=data.dogs[0]?.id||'';save();render();showToast('Dog profile removed')}
      document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;render()}));$('#dog-select').addEventListener('change',e=>{data.selectedDog=e.target.value;save();if(view==='plan')render()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
    })();
  </script>
</body>
</html>
